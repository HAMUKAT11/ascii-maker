<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>高画質ASCIIメーカー</title>

<style>

body{
font-family:monospace;
padding:20px;
background:white;
}

#output{
white-space:pre;
font-size:4px;
line-height:4px;
margin-top:20px;
border:1px solid black;
padding:10px;
overflow:auto;
}

button{
padding:10px;
font-size:18px;
}

</style>

</head>

<body>

<h2>高画質アスキーアートメーカー</h2>

<input type="file" id="imageInput">

<br><br>

<button onclick="convert()">変換</button>

<div id="output">

ここに表示される

</div>

<script>

function convert(){

const file=document.getElementById("imageInput").files[0];

if(!file){
alert("画像選んで");
return;
}

const reader=new FileReader();

reader.onload=function(e){

const img=new Image();

img.onload=function(){

const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

/* 高画質設定 */
const width=150;
const height=Math.floor(img.height/img.width*width);

canvas.width=width;
canvas.height=height;

ctx.drawImage(img,0,0,width,height);

const data=ctx.getImageData(0,0,width,height).data;

let ascii="";

/* 高精細文字セット */
const chars=
"@%#WMBRXVYIti+=;:,. ";

for(let y=0;y<height;y++){

for(let x=0;x<width;x++){

const i=(y*width+x)*4;

const r=data[i];
const g=data[i+1];
const b=data[i+2];

const brightness=(r+g+b)/3;

const index=Math.floor(
brightness/255*(chars.length-1)
);

ascii+=chars[index];

}

ascii+="\n";

}

document.getElementById("output").innerText=ascii;

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}

</script>

</body>

</html>
